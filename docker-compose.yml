services:
  file-node:
    image: ${DOCKER_IMAGE:-tonyliuzj/file-node:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: ${CONTAINER_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-/app/data/data.db}
    ports:
      - "${HOST_PORT:-3000}:${CONTAINER_PORT:-3000}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000)).then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
