name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nothing here needs to write to the repository; Docker Hub is reached with its own secrets.
permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same npm version as the Dockerfile: the lockfile is written by npm 11, which npm 10 can reject.
      - name: Install npm 11
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  docker:
    name: Build and push to Docker Hub
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tonyliuzj/file-node:latest
            tonyliuzj/file-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
