name: Upload file-node.sh to Release

on:
  push:
    branches:
      - main
    paths:
      - file-node.sh
      - .github/workflows/release.yml

jobs:
  upload-release-asset:
    name: Upload file-node.sh to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure latest release exists
        id: latest_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'latest',
              });
              core.setOutput('release_id', String(release.id));
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: 'latest',
              name: 'Latest Release',
              body: 'Latest File Node install script.',
              draft: false,
              prerelease: false,
            });
            core.setOutput('release_id', String(release.id));

      - name: Delete existing file-node.sh asset
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number('${{ steps.latest_release.outputs.release_id }}');
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id,
            });

            for (const asset of assets) {
              if (asset.name === 'file-node.sh') {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Upload file-node.sh to Release
        uses: softprops/action-gh-release@v2
        with:
          files: file-node.sh
          tag_name: latest
          token: ${{ secrets.GITHUB_TOKEN }}
