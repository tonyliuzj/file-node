name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same npm version as the Dockerfile: the lockfile is written by npm 11, which npm 10 can reject.
      - name: Install npm 11
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The PDF viewer library pins an old PDF.js with a known script-execution flaw, which this
      # setting neutralises. Losing it, or the line that applies it, would silently reopen the hole.
      - name: Check PDF.js hardening is in place
        run: |
          file="src/app/files/[fileId]/PdfViewerClient.tsx"
          grep -qF "isEvalSupported: false" "$file"
          grep -qF "transformGetDocumentParams={hardenDocumentParams}" "$file"

      - name: Build
        run: npm run build
